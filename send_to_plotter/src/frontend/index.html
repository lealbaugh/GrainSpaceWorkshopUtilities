<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Send to Plotter</title>
	<link href="main.css" rel="stylesheet" />
</head>
<body>
	<svg
	  viewBox="0 0 215.9 279.4"
	  width="215.9mm"
	  height="279.4mm"
	  xmlns="http://www.w3.org/2000/svg">
	  </svg>
	  <div id="controls">
	  	<div id="portSelection">
	  		<select id="dropdown"></select>
	  		<button id="connect">connect to port</button>
	  	</div>
	  	<div id="fakemodeDiv">
	  		<input type="checkbox" id="fakemode" switch=""><label for="fakemode">fakemode (refresh after changing)</label>
	  	</div>
	  	<div id="startStopControls" class="hidden">
	  		<button id="go">go</button><button id="stop">stop</button>
	  	</div>
	  </div>
	  <div id="plotterConfig">
	  </div>
</body>
<script type="text/javascript" src="main.js"></script>
</html>
